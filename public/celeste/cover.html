<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Celeste</title>
    <style>
      * { box-sizing: border-box; }
      html, body, [data-celeste-cover] { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #070b18; }
      [data-celeste-cover] { position: relative; isolation: isolate; }
      [data-celeste-cover]::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(to top, rgba(7, 11, 24, .88), transparent 66%, rgba(7, 11, 24, .2));
      }
    </style>
  </head>
  <body>
    <div data-celeste-cover></div>
    <script type="module" src="./cover.js"></script>
  </body>
</html>
